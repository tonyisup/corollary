name: Corollary CI

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio faster-whisper edge-tts
      - name: Install ffmpeg
        run: brew install ffmpeg
      - run: PYTHONPATH=packages pytest tests/unit/ -v --tb=short
